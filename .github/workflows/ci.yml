name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        # Build also generates src/routeTree.gen.ts, which typecheck needs.
        run: bun run build
        env:
          VITE_SUPABASE_URL: "https://ci-placeholder.supabase.co"
          VITE_SUPABASE_PROJECT_ID: "ci-placeholder"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
      - name: Typecheck
        run: bun run typecheck
