# Nginx reverse-proxy configuration for the Greenwood School ERP.
# Install to /etc/nginx/sites-available/greenwood-erp and symlink into sites-enabled.
# Replace erp.example.com and the certificate paths, then `nginx -t && systemctl reload nginx`.

# Rate-limit auth-sensitive endpoints (server functions POST through /_serverFn/).
limit_req_zone $binary_remote_addr zone=erp_api:10m rate=20r/s;

upstream greenwood_erp {
    # PM2 cluster listens on one shared port.
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;
    # ACME challenge passthrough for certbot, everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.example.com;

    ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers (the app also sets the non-HSTS ones itself).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression.
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    client_max_body_size 20m;   # document/photo uploads

    # Hashed build assets: serve directly from disk, cache forever.
    # Adjust the alias to the deployed app directory.
    location /assets/ {
        alias /var/www/greenwood-erp/.output/public/assets/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @app;
    }

    location = /favicon.ico {
        alias /var/www/greenwood-erp/.output/public/favicon.ico;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Health probe (no logs, no rate limit).
    location = /api/health {
        access_log off;
        proxy_pass http://greenwood_erp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Server-function RPCs — rate limited.
    location /_serverFn/ {
        limit_req zone=erp_api burst=40 nodelay;
        proxy_pass http://greenwood_erp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: SSR app.
    location @app {
        proxy_pass http://greenwood_erp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://greenwood_erp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
